<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PadelMetrix · Il Padel, Analizzato.</title>
<meta name="description" content="PadelMetrix: la guida indipendente per scegliere l'attrezzatura da padel. Il sito è in costruzione, torniamo presto.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F3D2E'/%3E%3Crect x='8' y='16' width='48' height='32' rx='3' fill='none' stroke='%23EAF5EC' stroke-width='4'/%3E%3Cline x1='32' y1='11' x2='32' y2='53' stroke='%23EAF5EC' stroke-width='4'/%3E%3Ccircle cx='45' cy='25' r='7' fill='%23C6F432'/%3E%3C/svg%3E">
<style>
  :root{--bg:#08140f;--bg2:#0d231a;--line:rgba(198,244,50,.22);--accent:#C6F432;--text:#eef5ee;--muted:#9db3a5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;color:var(--text);background:radial-gradient(1200px 700px at 50% 110%,var(--bg2),var(--bg));display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
  .court{position:absolute;inset:0;margin:auto;width:min(92vw,980px);aspect-ratio:2/1;border:2px solid var(--line);border-radius:8px;pointer-events:none}
  .court::before{content:"";position:absolute;left:50%;top:-6%;bottom:-6%;width:2px;background:var(--line)}
  .court::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--line),var(--line)) 25% 0/2px 100% no-repeat,linear-gradient(var(--line),var(--line)) 75% 0/2px 100% no-repeat,linear-gradient(var(--line),var(--line)) 25% 50%/50% 2px no-repeat}
  main{position:relative;text-align:center;max-width:620px;z-index:1}
  .brand{display:inline-flex;align-items:center;gap:14px}
  .logo{font-weight:700;letter-spacing:-.03em;font-size:clamp(2.4rem,8vw,4.2rem);line-height:1}
  .logo span{font-weight:400;color:var(--accent)}
  .tag{margin-top:.8rem;color:var(--muted);font-size:clamp(1rem,2.6vw,1.2rem);letter-spacing:.04em}
  .badge{display:inline-flex;align-items:center;gap:.6rem;margin-top:2.2rem;padding:.55rem 1rem;border:1px solid var(--line);border-radius:999px;font-size:.85rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);background:rgba(8,20,15,.6)}
  .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);animation:ball 1.6s ease-in-out infinite}
  @keyframes ball{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:.55}}
  p.msg{margin-top:1.6rem;opacity:.9;font-size:1.05rem;line-height:1.6}
  footer{margin-top:2.4rem;font-size:.8rem;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
  <div class="court" aria-hidden="true"></div>
  <main>
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="14" width="52" height="36" rx="4" fill="none" stroke="#EAF5EC" stroke-width="4"/><line x1="19" y1="14" x2="19" y2="50" stroke="#EAF5EC" stroke-width="2"/><line x1="45" y1="14" x2="45" y2="50" stroke="#EAF5EC" stroke-width="2"/><line x1="19" y1="32" x2="45" y2="32" stroke="#EAF5EC" stroke-width="2"/><line x1="32" y1="9" x2="32" y2="55" stroke="#EAF5EC" stroke-width="4" stroke-linecap="round"/><circle cx="45" cy="23" r="6.5" fill="#C6F432"/></svg>
      <h1 class="logo">padel<span>metrix</span></h1>
    </div>
    <p class="tag">Il Padel, Analizzato.</p>
    <div class="badge"><span class="dot" aria-hidden="true"></span>Work in progress</div>
    <p class="msg">Stiamo preparando la guida indipendente per scegliere l'attrezzatura da padel: racchette, abbigliamento e attrezzatura per bambini, con schede tecniche, confronti e consigli. Torna a trovarci presto.</p>
    <footer>&copy; 2026 PadelMetrix</footer>
  </main>
</body>
</html>
