name: Cerca ASIN Amazon
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug separati da spazio (vuoto = tutte le schede)"
        default: ""
      pickleball:
        description: "Cerca le racchette da pickleball invece di quelle da padel"
        type: boolean
        default: false
jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cerca su amazon.it
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_VERSION: ${{ secrets.CREATORS_VERSION }}
        run: python3 scripts/amazon/cerca_asin.py ${{ github.event.inputs.pickleball == 'true' && '--pickleball' || '' }} ${{ github.event.inputs.slug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidati-asin
          path: amazon-out/
          if-no-files-found: ignore
