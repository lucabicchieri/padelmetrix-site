name: Leggi fonti schede
on:
  workflow_dispatch:
    inputs:
      file:
        default: "scripts/fonti/pagine.txt"
      maxc:
        default: "6000"
      script:
        default: "leggi_pagine.py"
jobs:
  leggi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Leggi pagine
        env:
          MAXC: ${{ github.event.inputs.maxc }}
        run: python3 scripts/fonti/${{ github.event.inputs.script }} ${{ github.event.inputs.file }}
