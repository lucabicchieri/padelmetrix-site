name: Immagini Amazon
# Ogni giorno aggiorna gli URL delle immagini ufficiali dalla Creators API
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/racchette/**"]
permissions:
  contents: write
concurrency:
  group: amazon-immagini
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroga la Creators API
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_VERSION: ${{ secrets.CREATORS_VERSION }}
        run: python3 scripts/amazon/aggiorna_immagini.py
      - name: Salva se cambiato
        run: |
          git config user.name "padelmetrix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon/immagini.json
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Aggiorna immagini Amazon"
          git pull --rebase -q origin main
          git push
