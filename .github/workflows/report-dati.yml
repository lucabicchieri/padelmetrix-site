name: Dati report settimanale
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script in scripts/report da eseguire
        default: dati_report.py
jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-auth requests
      - name: Search Console e Analytics
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GA4_PROPERTY_ID: "560678666"
          GSC_SITE: "https://www.padelmetrix.com/"
        run: cd scripts/report && python3 ${{ inputs.script || 'dati_report.py' }}
      - uses: actions/upload-artifact@v4
        with:
          name: report-dati
          path: scripts/report/report_dati.json
          if-no-files-found: ignore
          retention-days: 30
